# config/supersonic/colors.template.toml

[SupersonicTheme]
Name = "Noctalia"
Version = "0.1"
SupportsDark = true
SupportsLight = true

[DarkColors]
PageBackground    = "{{colors.background.default.hex}}"
PageHeader        = "{{colors.surface_container_low.default.hex}}"
Background        = "{{colors.surface_container.default.hex}}"
ListHeader        = "{{colors.surface_container_high.default.hex}}"
MenuBackground    = "{{colors.surface_container_high.default.hex}}"
OverlayBackground = "{{colors.surface_container_highest.default.hex}}"
InputBackground   = "{{colors.surface_container_highest.default.hex}}"
InputBorder       = "{{colors.outline_variant.default.hex}}"
Button            = "{{colors.surface_container_highest.default.hex}}"
DisabledButton    = "{{colors.surface_container_low.default.hex}}"
Disabled          = "{{colors.outline.default.hex}}"
Placeholder       = "{{colors.outline.default.hex}}"
Foreground        = "{{colors.on_surface.default.hex}}"
Primary           = "{{colors.primary.default.hex}}"
Hyperlink         = "{{colors.primary.default.hex}}"
Focus             = "{{colors.primary.default.hex}}"
Hover             = "{{colors.hover.default.hex}}"
Pressed           = "{{colors.primary_container.default.hex}}"
Selection         = "{{colors.primary_container.default.hex}}"
ScrollBar         = "{{colors.outline.default.hex}}"
Separator         = "{{colors.outline_variant.default.hex}}"
Shadow            = "{{colors.shadow.default.hex}}66"
Success           = "{{colors.terminal_normal_green.default.hex}}"
Warning           = "{{colors.terminal_normal_yellow.default.hex}}"
Error             = "{{colors.error.default.hex}}"

[LightColors]
PageBackground    = "{{colors.background.default.hex}}"
PageHeader        = "{{colors.surface_container_low.default.hex}}"
Background        = "{{colors.surface_container.default.hex}}"
ListHeader        = "{{colors.surface_container_high.default.hex}}"
MenuBackground    = "{{colors.surface_container_high.default.hex}}"
OverlayBackground = "{{colors.surface_container_highest.default.hex}}"
InputBackground   = "{{colors.surface_container_highest.default.hex}}"
InputBorder       = "{{colors.outline_variant.default.hex}}"
Button            = "{{colors.surface_container_highest.default.hex}}"
DisabledButton    = "{{colors.surface_container_low.default.hex}}"
Disabled          = "{{colors.outline.default.hex}}"
Placeholder       = "{{colors.outline.default.hex}}"
Foreground        = "{{colors.on_surface.default.hex}}"
Primary           = "{{colors.primary.default.hex}}"
Hyperlink         = "{{colors.primary.default.hex}}"
Focus             = "{{colors.primary.default.hex}}"
Hover             = "{{colors.hover.default.hex}}"
Pressed           = "{{colors.primary_container.default.hex}}"
Selection         = "{{colors.primary_container.default.hex}}"
ScrollBar         = "{{colors.outline.default.hex}}"
Separator         = "{{colors.outline_variant.default.hex}}"
Shadow            = "{{colors.shadow.default.hex}}66"
Success           = "{{colors.terminal_normal_green.default.hex}}"
Warning           = "{{colors.terminal_normal_yellow.default.hex}}"
Error             = "{{colors.error.default.hex}}"
