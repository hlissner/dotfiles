# config/noctalia/plugins/compass/plugin.toml
#
# Mine. Under the scrolling layout and "infinite" workspaces, nothing in the
# bar says whether there's anything above or below this workspace, whether
# the tape has windows hanging off either side of the screen, or how far from
# home (the monitor's default workspace) I've wandered. This is a small dial
# that answers all three: four quadrants (a pizza cut on the diagonals, so
# each faces a compass point) light up per direction, and a badge in the
# middle counts the SUPER+j/k presses back home.
#
# Two entries. The service keeps `niri msg -j event-stream` open and derives
# one line per output, whatever the number of bars: the tape is an output's
# workspaces by idx, home is the one named `home` or the top one, and
# west/east are tiles past the view's edges (or, without the patched niri's
# view positions, a lower bound from column widths). niri has no special workspaces
# -- one `hey wm launch -n` made is a plain named one on the tape -- so the
# special palette is for a north/south quadrant whose next workspace is named.
# A widget draws its own monitor's line, or the focused monitor's if told to.
#
# Three. Since the dial is easy to miss across three monitors, the same line
# also puts a soft glow along each edge of the monitor itself: four [[layer]]
# surfaces per output, click-through, on the top layer so a fullscreen window
# covers them, and dark while the overview is open (all the workspaces are on
# show then). West/east are exact under the niri modules/wm/niri builds, whose
# patch puts the view position into the IPC; under a stock niri they're the
# service's lower bound.

id           = "hey/compass"
name         = "Workspace Compass"
version      = "1.7.0"
plugin_api   = 36  # [[layer]] entries (and getColor at 31; the SVG needs real hex)
author       = "hlissner"
license      = "MIT"
dependencies = ["niri"]
tags         = ["niri", "workspaces", "bar"]
icon         = "compass"
description  = "Where the occupied workspaces and off-screen windows are, and how far home is."

# Plugin-level, so the service sees it (widget settings don't reach it).
[[setting]]
key             = "poll_ms"
type            = "int"
label_key       = "settings.poll_ms.label"
description_key = "settings.poll_ms.description"
default         = 1000
min             = 0
max             = 60000

[[setting]]
key             = "edge_glow"
type            = "bool"
label_key       = "settings.edge_glow.label"
description_key = "settings.edge_glow.description"
default         = true

[[setting]]
key             = "edge_width"
type            = "int"
label_key       = "settings.edge_width.label"
description_key = "settings.edge_width.description"
default         = 12
min             = 1
max             = 64

# exclusive_zone -1 puts a strip at the monitor's true edge, over the bar;
# 0 keeps it just inside whatever reserves space there.
[[setting]]
key             = "edge_over_panels"
type            = "bool"
label_key       = "settings.edge_over_panels.label"
description_key = "settings.edge_over_panels.description"
default         = false

[[setting]]
key             = "edge_opacity_north"
type            = "int"
label_key       = "settings.edge_opacity_north.label"
description_key = "settings.edge_opacity.description"
default         = 70
min             = 0
max             = 100

[[setting]]
key             = "edge_opacity_south"
type            = "int"
label_key       = "settings.edge_opacity_south.label"
description_key = "settings.edge_opacity.description"
default         = 70
min             = 0
max             = 100

[[setting]]
key             = "edge_opacity_west"
type            = "int"
label_key       = "settings.edge_opacity_west.label"
description_key = "settings.edge_opacity.description"
default         = 70
min             = 0
max             = 100

[[setting]]
key             = "edge_opacity_east"
type            = "int"
label_key       = "settings.edge_opacity_east.label"
description_key = "settings.edge_opacity.description"
default         = 70
min             = 0
max             = 100

[[setting]]
key             = "edge_rounding"
type            = "int"
label_key       = "settings.edge_rounding.label"
description_key = "settings.edge_rounding.description"
default         = 60
min             = 0
max             = 100

[[setting]]
key             = "edge_color"
type            = "color"
label_key       = "settings.edge_color.label"
description_key = "settings.edge_color.description"
default         = ""
advanced        = true

[[setting]]
key             = "edge_named_color"
type            = "color"
label_key       = "settings.edge_named_color.label"
description_key = "settings.edge_named_color.description"
default         = ""
advanced        = true

[[service]]
id    = "poll"
entry = "service.luau"

# One entry file per edge: a script can't ask which entry it is, so each is a
# stub that hands its direction to edge.luau. The width/height here is only
# the default; the service's configure() applies edge_width and, from
# edge_over_panels, the exclusive zone (0: inside the bar's zone, on the
# window area's edge; -1: the monitor's own edge, over the bar).
[[layer]]
id            = "north"
entry         = "north.luau"
layer         = "top"
anchors       = ["top", "left", "right"]
height        = 12
click_through = true
output        = "all"
visible       = true

[[layer]]
id            = "south"
entry         = "south.luau"
layer         = "top"
anchors       = ["bottom", "left", "right"]
height        = 12
click_through = true
output        = "all"
visible       = true



[[widget]]
id    = "compass"
entry = "widget.luau"

  [[widget.setting]]
  key             = "monitor"
  type            = "select"
  label_key       = "settings.monitor.label"
  description_key = "settings.monitor.description"
  default         = "bar"
  options = [
    { value = "bar",     label_key = "settings.monitor.options.bar" },
    { value = "focused", label_key = "settings.monitor.options.focused" },
  ]

  [[widget.setting]]
  key             = "shape"
  type            = "select"
  label_key       = "settings.shape.label"
  description_key = "settings.shape.description"
  default         = "circle"
  options = [
    { value = "circle", label_key = "settings.shape.options.circle" },
    { value = "square", label_key = "settings.shape.options.square" },
  ]

  [[widget.setting]]
  key             = "size"
  type            = "int"
  label_key       = "settings.size.label"
  description_key = "settings.size.description"
  default         = 20
  min             = 10
  max             = 64

  [[widget.setting]]
  key             = "radius"
  type            = "int"
  label_key       = "settings.radius.label"
  default         = 5
  min             = 0
  max             = 32
  visible_when    = { key = "shape", values = ["square"] }

  [[widget.setting]]
  key             = "divider"
  type            = "int"
  label_key       = "settings.divider.label"
  description_key = "settings.divider.description"
  default         = 1
  min             = 0
  max             = 8

  # 0 = derived from the size (half of it, and 0.8 of the badge), which is
  # what the defaults used to be hard-wired to.
  [[widget.setting]]
  key             = "badge_size"
  type            = "int"
  label_key       = "settings.badge_size.label"
  description_key = "settings.badge_size.description"
  default         = 0
  min             = 0
  max             = 64

  [[widget.setting]]
  key             = "font_size"
  type            = "int"
  label_key       = "settings.font_size.label"
  description_key = "settings.font_size.description"
  default         = 0
  min             = 0
  max             = 64

  [[widget.setting]]
  key             = "font_family"
  type            = "string"
  label_key       = "settings.font_family.label"
  description_key = "settings.font_family.description"
  default         = ""
  advanced        = true

  # `color` is the same roles/Custom dropdown the bar's own Color and Icon
  # Color settings get -- but a plugin's only grows the "Default" entry when the
  # setting is `advanced` (settings_content_plugins.cpp: allowNone =
  # spec.advanced). Default is "", and what it means is up to widget.luau: a
  # faint dial, primary/secondary/tertiary quadrants, on_surface text -- and
  # for the special pair, the same rotated, so a named neighbour reads as one
  # unasked.
  [[widget.setting]]
  key             = "fill"
  type            = "color"
  label_key       = "settings.fill.label"
  description_key = "settings.fill.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "workspace_color"
  type            = "color"
  label_key       = "settings.workspace_color.label"
  description_key = "settings.workspace_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "home_color"
  type            = "color"
  label_key       = "settings.home_color.label"
  description_key = "settings.home_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "window_color"
  type            = "color"
  label_key       = "settings.window_color.label"
  description_key = "settings.window_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "divider_color"
  type            = "color"
  label_key       = "settings.divider_color.label"
  description_key = "settings.divider_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "badge_color"
  type            = "color"
  label_key       = "settings.badge_color.label"
  description_key = "settings.badge_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "text_color"
  type            = "color"
  label_key       = "settings.text_color.label"
  description_key = "settings.text_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "special_workspace_color"
  type            = "color"
  label_key       = "settings.special_workspace_color.label"
  description_key = "settings.special_workspace_color.description"
  default         = ""
  advanced        = true

  [[widget.setting]]
  key             = "special_home_color"
  type            = "color"
  label_key       = "settings.special_home_color.label"
  description_key = "settings.special_home_color.description"
  default         = ""
  advanced        = true

[[layer]]
id            = "west"
entry         = "west.luau"
layer         = "top"
anchors       = ["left", "top", "bottom"]
width         = 12
click_through = true
output        = "all"
visible       = true

[[layer]]
id            = "east"
entry         = "east.luau"
layer         = "top"
anchors       = ["right", "top", "bottom"]
width         = 12
click_through = true
output        = "all"
visible       = true
