# tmux.conf
########################################

set -ga terminal-overrides ",*-256color*:Tc"

setw -g automatic-rename on      # rename window after current program
set  -g renumber-windows on      # renumber windows when one is closed
# Zero-based indexing is fine in programming languages, but not so much in a
# multiplexer when zero is on the other side of the keyboard.
set  -g base-index 1
setw -g pane-base-index 1
# display tmux messages longer
set  -g display-time 1500
set  -g display-panes-time 800
# Address vim-mode switching delay (http://superuser.com/a/252717/65504)
set  -s escape-time   40
set -sg repeat-time   600
set  -g history-limit 60000
# Update status-{left,right} more often (default: 15)
set  -g status-interval 5
# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize off
# For terminals that support them, propagate these events to programs that
# understand them.
set  -s focus-events on
# Enable mouse + mouse wheel
set  -g mouse on
# Support the kitty keyboard protocol
set  -g extended-keys on
set  -g extended-keys-format csi-u

set  -g set-clipboard external


########################################
# Keybinds                             #
########################################

# Rebind prefix to C-c. Press twice to send literal C-c.
unbind C-b
set -g prefix C-c
bind C-c send-prefix
bind C-b display-message
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vi-style keybinds
set -g status-keys vi
set -g mode-keys   vi

bind c new-window      -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H run 'hey @tmux swap-pane left'
bind J run 'hey @tmux swap-pane down'
bind K run 'hey @tmux swap-pane up'
bind L run 'hey @tmux swap-pane right'
bind M run 'hey @tmux swap-pane master'

bind o resize-pane -Z
bind S choose-session
bind W choose-window
bind / choose-session
bind . choose-window

# bind = select-layout tiled
bind | select-layout even-horizontal
bind _ select-layout even-vertical

# Disable confirmation
bind x kill-pane
bind X kill-window
bind q kill-session
bind Q kill-server

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind C-w last-pane
bind C-n next-window
bind C-p previous-window

bind = run 'hey @tmux balance-panes'   # emacs' balance-windows
bind - break-pane
bind _ join-pane

# reload config without killing server
bind r source-file /etc/tmux.conf \; display-message "  Config reloaded..".
bind ^r refresh-client


########################################
# Copy mode                            #
########################################

bind Enter copy-mode # enter copy mode
bind b list-buffers  # list paster buffers
bind B choose-buffer # choose which buffer to paste from
bind p paste-buffer  # paste from the top paste buffer
# bind P run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"
bind P run "wl-paste | tmux load-buffer - ; tmux paste-buffer"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-g send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line


########################################
# Plugins                              #
########################################

set -g @prefix_highlight_prefix_prompt 'C-c'
set -g @prefix_highlight_show_copy_mode 'on'

# C-c ?   -> fuzzback
# C-c Tab -> extrakto


########################################
# Theming                              #
########################################

if '[ -f ~/.config/tmux/themes/noctalia.conf ]' 'source-file ~/.config/tmux/themes/noctalia.conf'

# The statusbar
# only show status bar if there is more then one window
set -g status off
set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on
set-option -g bell-action none


setw -g window-status-format '#[fg=#{@hey_outline}] #W #[fg=default]'
setw -g window-status-current-format '#[bg=#{@hey_secondary_container},fg=#{@hey_primary},bold] #W #[bg=default,fg=default,nobold]'

# tmux-prefix-highlight
set -g @prefix_highlight_fg '#{@hey_primary}'
set -g @prefix_highlight_bg '#{@hey_secondary_container}'
set -g @prefix_highlight_copy_mode_attr 'fg=#{@hey_surface},bg=#{@hey_inverse_primary}'

# UI
set -g status-position top
set -g status-justify left
set -g status-left '#{prefix_highlight}'
set -g status-right ' #H #[fg=#{@hey_primary},bold] #S #[fg=default,nobold]'
# set -g status-right-length 30
# set -g status-left-length 30
set -gqF status-style "bg=#{@hey_surface_container_low},fg=#{@hey_on_surface}"
if-shell -F '#{==:#{@hey_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@hey_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@hey_surface_container},fg=#{@hey_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@hey_surface_container_highest},fg=#{@hey_on_surface},bold"
set -gqF window-status-last-style "fg=#{@hey_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@hey_tertiary_container},fg=#{@hey_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@hey_error_container},fg=#{@hey_on_error_container},bold"
set -gqF pane-border-style "fg=#{@hey_outline_variant}"
set -gqF pane-active-border-style "fg=#{@hey_primary}"
set -gqF mode-style "bg=#{@hey_secondary_container},fg=#{@hey_on_secondary_container},bold"
set -gqF message-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container}"
set -gqF message-command-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container}"
set -gqF popup-style "bg=#{@hey_surface},fg=#{@hey_on_surface}"
set -gqF popup-border-style "fg=#{@hey_outline}"
set -gqF menu-style "bg=#{@hey_surface_container_high},fg=#{@hey_on_surface}"
set -gqF menu-selected-style "bg=#{@hey_primary},fg=#{@hey_on_primary},bold"
set -gqF menu-border-style "fg=#{@hey_outline}"
set -gqF copy-mode-match-style "bg=#{@hey_tertiary_container},fg=#{@hey_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@hey_primary_container},fg=#{@hey_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@hey_secondary_container},fg=#{@hey_on_secondary_container}"
set -gqF clock-mode-colour "#{@hey_primary}"
