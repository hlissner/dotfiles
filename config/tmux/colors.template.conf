# config/tmux/colors.template.conf --- Noctalia renders this into
# ~/.config/tmux/themes/noctalia.conf

# Seed
set -gq @hey_source_color               "{{colors.source_color.default.hex}}"
set -gq @hey_surface_tint               "{{colors.surface_tint.default.hex}}"

# Primary
set -gq @hey_primary                    "{{colors.primary.default.hex}}"
set -gq @hey_on_primary                 "{{colors.on_primary.default.hex}}"
set -gq @hey_primary_container          "{{colors.primary_container.default.hex}}"
set -gq @hey_on_primary_container       "{{colors.on_primary_container.default.hex}}"
set -gq @hey_primary_fixed              "{{colors.primary_fixed.default.hex}}"
set -gq @hey_primary_fixed_dim          "{{colors.primary_fixed_dim.default.hex}}"
set -gq @hey_on_primary_fixed           "{{colors.on_primary_fixed.default.hex}}"
set -gq @hey_on_primary_fixed_variant   "{{colors.on_primary_fixed_variant.default.hex}}"

# Secondary
set -gq @hey_secondary                  "{{colors.secondary.default.hex}}"
set -gq @hey_on_secondary               "{{colors.on_secondary.default.hex}}"
set -gq @hey_secondary_container        "{{colors.secondary_container.default.hex}}"
set -gq @hey_on_secondary_container     "{{colors.on_secondary_container.default.hex}}"
set -gq @hey_secondary_fixed            "{{colors.secondary_fixed.default.hex}}"
set -gq @hey_secondary_fixed_dim        "{{colors.secondary_fixed_dim.default.hex}}"
set -gq @hey_on_secondary_fixed         "{{colors.on_secondary_fixed.default.hex}}"
set -gq @hey_on_secondary_fixed_variant "{{colors.on_secondary_fixed_variant.default.hex}}"

# Tertiary
set -gq @hey_tertiary                   "{{colors.tertiary.default.hex}}"
set -gq @hey_on_tertiary                "{{colors.on_tertiary.default.hex}}"
set -gq @hey_tertiary_container         "{{colors.tertiary_container.default.hex}}"
set -gq @hey_on_tertiary_container      "{{colors.on_tertiary_container.default.hex}}"
set -gq @hey_tertiary_fixed             "{{colors.tertiary_fixed.default.hex}}"
set -gq @hey_tertiary_fixed_dim         "{{colors.tertiary_fixed_dim.default.hex}}"
set -gq @hey_on_tertiary_fixed          "{{colors.on_tertiary_fixed.default.hex}}"
set -gq @hey_on_tertiary_fixed_variant  "{{colors.on_tertiary_fixed_variant.default.hex}}"

# Error
set -gq @hey_error                      "{{colors.error.default.hex}}"
set -gq @hey_on_error                   "{{colors.on_error.default.hex}}"
set -gq @hey_error_container            "{{colors.error_container.default.hex}}"
set -gq @hey_on_error_container         "{{colors.on_error_container.default.hex}}"

# Surface
set -gq @hey_surface                    "{{colors.surface.default.hex}}"
set -gq @hey_on_surface                 "{{colors.on_surface.default.hex}}"
set -gq @hey_surface_variant            "{{colors.surface_variant.default.hex}}"
set -gq @hey_on_surface_variant         "{{colors.on_surface_variant.default.hex}}"
set -gq @hey_surface_dim                "{{colors.surface_dim.default.hex}}"
set -gq @hey_surface_bright             "{{colors.surface_bright.default.hex}}"
set -gq @hey_surface_container_lowest   "{{colors.surface_container_lowest.default.hex}}"
set -gq @hey_surface_container_low      "{{colors.surface_container_low.default.hex}}"
set -gq @hey_surface_container          "{{colors.surface_container.default.hex}}"
set -gq @hey_surface_container_high     "{{colors.surface_container_high.default.hex}}"
set -gq @hey_surface_container_highest  "{{colors.surface_container_highest.default.hex}}"

# Outline and utility
set -gq @hey_outline                    "{{colors.outline.default.hex}}"
set -gq @hey_outline_variant            "{{colors.outline_variant.default.hex}}"
set -gq @hey_shadow                     "{{colors.shadow.default.hex}}"
set -gq @hey_scrim                      "{{colors.scrim.default.hex}}"

# Inverse
set -gq @hey_inverse_surface            "{{colors.inverse_surface.default.hex}}"
set -gq @hey_inverse_on_surface         "{{colors.inverse_on_surface.default.hex}}"
set -gq @hey_inverse_primary            "{{colors.inverse_primary.default.hex}}"

# Background
set -gq @hey_background                 "{{colors.background.default.hex}}"
set -gq @hey_on_background              "{{colors.on_background.default.hex}}"

